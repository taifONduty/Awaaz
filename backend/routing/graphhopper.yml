# GraphHopper 11.1. Paths and the immutable graph version are supplied by the
# start script, which verifies the engine, input and configuration digests.
graphhopper:
  datareader.file: ""
  graph.location: ""
  profiles:
    - name: car
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: []
      custom_model:
        distance_influence: 0
        priority:
          - if: "!car_access || road_access != YES"
            multiply_by: "0"
        speed:
          - if: "true"
            limit_to: "car_average_speed"
    - name: foot
      custom_model_files: []
      custom_model:
        distance_influence: 0
        priority:
          - if: "!foot_access || (foot_road_access != MISSING && foot_road_access != YES && foot_road_access != DESIGNATED) || hike_rating >= 2"
            multiply_by: "0"
        speed:
          - if: "true"
            limit_to: "foot_average_speed"
  profiles_ch: []
  profiles_lm: []
  graph.encoded_values: car_access, car_average_speed, foot_access, foot_average_speed, road_access, foot_road_access, hike_rating
  import.osm.ignored_highways: ""
  graph.dataaccess.default_type: RAM_STORE
  routing.max_visited_nodes: 200000
  routing.timeout_ms: 6000
  routing.snap_preventions_default: ferry
server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
  request_log:
    appenders: []
logging:
  level: WARN
  loggers:
    com.graphhopper: INFO
    com.graphhopper.resources.RouteResource: OFF
    com.graphhopper.http: OFF
    com.graphhopper.resources: OFF
  appenders:
    - type: console
      log_format: "%d{HH:mm:ss} %-5level %logger{30} - %msg%n"
