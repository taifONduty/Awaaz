name: awaaz
description: Awaaz Dhaka safety companion — first reviewable vertical slice.
publish_to: none
version: 2.0.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geolocator: 14.1.1
  google_maps_flutter: 2.18.2
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: 6.3.3
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
dependency_overrides:
  # Pinned upstream source with optional GNSS telemetry gated for 2D fixes.
  # See third_party/geolocator_android/PATCH.md.
  geolocator_android:
    path: ../../third_party/geolocator_android
flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
